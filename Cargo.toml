[package]
name = "portix"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "The local development service explorer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SergioAngel-1/Portix"
keywords = ["tui", "ports", "development", "linux"]
categories = ["command-line-utilities"]

[[bin]]
name = "portix"
path = "src/main.rs"

[lib]
name = "portix_lib"
path = "src/lib.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Concurrency

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Fuzzy matching
nucleo-matcher = "0.3"

# Terminal column widths for layout fitting
unicode-width = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"

# XDG directories
directories = "6"

# System calls
libc = "0.2"

# Termination signals: exit through the normal restore path so the terminal
# is never left in raw mode (SIGTERM/SIGHUP/SIGINT otherwise kill without
# unwinding, stranding the user's terminal without echo).
signal-hook = "0.3"

# Shell completions
clap_complete = "4"

# Clipboard (optional, for v1)
# arboard = "3"

[dev-dependencies]
tempfile = "3"

# `main.rs` is a separate crate root, so the `#![deny(unsafe_code)]` in
# `lib.rs` does not cover it. Deny it for every target from one place; the
# syscall wrappers in `platform::linux` opt back in with `#[allow(unsafe_code)]`
# next to their SAFETY comments.
[lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
